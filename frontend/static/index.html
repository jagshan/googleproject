<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry & Weather Assistant</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --accent: #059669;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #047857 100%);
    --accent-light: #ecfdf5;
    --accent-border: #a7f3d0;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text-primary);
  }

  /* Header */
  .app-header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 1rem 1.5rem;
    box-shadow: 0 2px 10px rgba(5, 150, 105, 0.2);
  }
  .header-content {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title-wrapper { display: flex; align-items: center; gap: 0.8rem; }
  .header-icon { font-size: 1.8rem; line-height: 1; }
  .header-title { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
  .header-subtitle { margin: 0.25rem 0 0; font-size: 0.8rem; opacity: 0.9; font-weight: 400; display: flex; align-items: center; gap: 0.4rem; }
  .status-dot { width: 7px; height: 7px; background: #34d399; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #34d399; }

  /* Main dialogue log */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .msg { display: flex; gap: 0.8rem; align-items: flex-start; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .msg.agent .avatar { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent-border); }
  .msg.user .avatar { background: #e2e8f0; color: var(--text-secondary); }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; white-space: normal; }

  /* Example prompt chips */
  .suggestions-wrapper { max-width: 820px; width: 100%; margin: 0 auto; padding: 0.4rem 1rem; }
  .suggestions { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.2rem; }
  .chip {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .chip:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
  }

  /* Input Form */
  .input-container { max-width: 820px; width: 100%; margin: 0 auto; padding: 0.4rem 1rem 1.2rem; }
  form {
    display: flex;
    gap: 0.6rem;
    background: var(--card-bg);
    padding: 0.5rem 0.6rem 0.5rem 1.1rem;
    border-radius: 28px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
  }
  input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 0.95rem;
    background: transparent;
    color: var(--text-primary);
  }
  button {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 20px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  button:hover { opacity: 0.95; transform: scale(1.02); }

  /* A2UI component styles */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-content">
    <div class="header-title-wrapper">
      <span class="header-icon">🥦</span>
      <div>
        <h1 class="header-title">Smart Pantry & Weather Assistant</h1>
        <p class="header-subtitle"><span class="status-dot"></span> AI Agent Online • Recipe & Local Assistant</p>
      </div>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="suggestions-wrapper">
  <div class="suggestions">
    <button type="button" class="chip" onclick="sendPrompt('What items do I have in my pantry?')">📦 Check Pantry</button>
    <button type="button" class="chip" onclick="sendPrompt('What\'s the weather in Seattle and what recipes can I make?')">🌤️ Weather & Recipes</button>
    <button type="button" class="chip" onclick="sendPrompt('Find nearby supermarkets in Seattle')">🛒 Nearby Stores</button>
  </div>
</div>

<div class="input-container">
  <form id="form">
    <input id="input" placeholder="Ask about pantry inventory, weather, or recipes…" autocomplete="off" autofocus>
    <button type="submit">Send ➔</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🥦");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function getChildIds(comp) {
  const p = comp && comp.properties;
  if (!p) return [];
  const ids = [];
  if (p.child) ids.push(p.child);
  const list = p.children && p.children.explicitList;
  if (Array.isArray(list)) ids.push(...list);
  return ids;
}

function renderComponent(comp, components) {
  if (!comp || !comp.type) return null;

  if (comp.type === "Card") {
    const card = el("div", "a2card");
    for (const childId of getChildIds(comp)) {
      const node = renderComponent(components[childId], components);
      if (node) card.appendChild(node);
    }
    return card;
  }

  if (comp.type === "Column") {
    const col = el("div", "a2col");
    for (const childId of getChildIds(comp)) {
      const node = renderComponent(components[childId], components);
      if (node) col.appendChild(node);
    }
    return col;
  }

  if (comp.type === "Row") {
    const p = comp.properties || {};
    const align = boundStr(p.distribution || p.alignment);
    const cls = "a2row" + (align.toLowerCase().includes("spacebetween") ? " between" : "");
    const row = el("div", cls);
    for (const childId of getChildIds(comp)) {
      const node = renderComponent(components[childId], components);
      if (node) row.appendChild(node);
    }
    return row;
  }

  if (comp.type === "Text") {
    const p = comp.properties || {};
    const text = boundStr(p.text);
    const hint = boundStr(p.usageHint).toLowerCase();
    let cls = "a2text";
    if (["h1", "h2", "h3", "h4", "caption"].includes(hint)) cls += " a2-" + hint;
    return el("p", cls, text);
  }

  if (comp.type === "Divider") return el("hr", "a2divider");

  if (comp.type === "List") {
    const list = el("div", "a2col");
    for (const childId of getChildIds(comp)) {
      const node = renderComponent(components[childId], components);
      if (node) list.appendChild(node);
    }
    return list;
  }

  if (comp.type === "Image") {
    const url = boundStr((comp.properties || {}).url);
    if (!/^https?:\/\//i.test(url)) return null;
    const img = el("img", "a2img");
    img.src = url;
    return img;
  }

  if (comp.type === "Icon") {
    const name = boundStr((comp.properties || {}).name);
    return el("span", "material-symbols-outlined", name);
  }

  return null;
}

function renderSurface(surface) {
  if (!surface || !surface.components) return null;
  const components = {};
  for (const c of surface.components) {
    if (c && c.id) components[c.id] = c;
  }
  const rootId = surface.rootId || "root";
  const root = components[rootId];
  if (!root) return null;
  return renderComponent(root, components);
}

function renderReply(bubbleEl, parts) {
  bubbleEl.textContent = "";
  let renderedAny = false;

  for (const p of parts) {
    if (p.kind === "text" && p.text) {
      const t = el("div", null, p.text);
      bubbleEl.appendChild(t);
      renderedAny = true;
    } else if (p.kind === "a2ui" && p.data) {
      let surface = null;
      if (p.data.surfaceUpdate) surface = p.data.surfaceUpdate;
      else if (p.data.beginRendering) surface = p.data.beginRendering;
      const card = renderSurface(surface);
      if (card) {
        bubbleEl.classList.add("rich");
        bubbleEl.appendChild(card);
        renderedAny = true;
      }
    }
  }

  if (!renderedAny) bubbleEl.textContent = "(The agent returned an empty reply.)";
  log.scrollTop = log.scrollHeight;
}

// Form submit handler
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
